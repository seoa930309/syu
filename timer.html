<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원형 집중 타이머</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eeece9;
    --text: #2b2b2b;
    --muted: #7a7672;
    --panel: #ffffff;
    --panel-border: #e2ddd8;
    --btn: #f4f1ee;
    --btn-hover: #ebe6e1;
    --accent: #c9961c;
    --accent-text: #ffffff;
    --shell: #f6ebe6;
    --shell-edge: #e7d6ce;
    --screen: #0b0b0d;
    --digit: #d7e6ff;
    --digit-dim: #8fa6c8;
    --arc-on: #c9961c;
    --arc-break: #3fb8a8;
    --arc-off: #1b1b1f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171a;
      --text: #ececec;
      --muted: #9a9aa2;
      --panel: #212125;
      --panel-border: #313137;
      --btn: #2a2a2f;
      --btn-hover: #34343a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17171a;
    --text: #ececec;
    --muted: #9a9aa2;
    --panel: #212125;
    --panel-border: #313137;
    --btn: #2a2a2f;
    --btn-hover: #34343a;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 40px;
  }
  .wrap { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 18px; }

  /* 모드 전환 */
  .modes {
    display: grid; grid-template-columns: 1fr 1fr;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 4px; gap: 4px;
  }
  .modes button {
    border: 0; border-radius: 10px; padding: 10px 0;
    font: 600 15px "Noto Sans KR", sans-serif;
    background: transparent; color: var(--muted); cursor: pointer;
  }
  .modes button.active { background: var(--accent); color: var(--accent-text); }

  /* 기기 외형 */
  .device {
    background: var(--shell);
    border-radius: 18%;
    padding: 7%;
    padding-bottom: 4%;
    box-shadow: inset 0 -6px 0 var(--shell-edge), 0 14px 30px rgba(0,0,0,.18);
    user-select: none;
  }
  .screen {
    background: var(--screen);
    border-radius: 7%;
    aspect-ratio: 1 / 1;
    position: relative;
    overflow: hidden;
    touch-action: none;
  }
  .screen svg { width: 100%; height: 100%; display: block; }
  .brand {
    text-align: center; font-family: Georgia, serif; font-size: 13px;
    color: #6b5d57; margin-top: 3%; letter-spacing: .02em;
  }

  .dial-num { font: 19px "Noto Sans KR", sans-serif; fill: var(--digit); }
  .dial-dot { fill: var(--digit); }
  .digits { font-family: "Share Tech Mono", ui-monospace, monospace; fill: var(--digit); }
  .digits-sub { fill: var(--digit-dim); }
  .unit { font: 10px "Noto Sans KR", sans-serif; fill: var(--digit-dim); }
  .clickable { cursor: pointer; }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  .glow { filter: drop-shadow(0 0 3px rgba(160,200,255,.45)); }

  /* 조작부 */
  .controls { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
  .controls button {
    border: 1px solid var(--panel-border); border-radius: 12px; padding: 14px 0;
    font: 700 16px "Noto Sans KR", sans-serif; cursor: pointer;
    background: var(--btn); color: var(--text);
  }
  .controls button:hover { background: var(--btn-hover); }
  .controls .primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  .controls .primary:hover { filter: brightness(1.06); background: var(--accent); }

  .panel {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 6px 16px;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; gap: 12px;
  }
  .row + .row { border-top: 1px solid var(--panel-border); }
  .row .label { font-weight: 600; font-size: 15px; }
  .row .hint { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button {
    width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--panel-border);
    background: var(--btn); color: var(--text); font-size: 20px; line-height: 1; cursor: pointer;
  }
  .stepper button:hover { background: var(--btn-hover); }
  .stepper button:disabled { opacity: .35; cursor: not-allowed; }
  .stepper input {
    width: 54px; height: 36px; text-align: center; border-radius: 10px;
    border: 1px solid var(--panel-border); background: var(--bg); color: var(--text);
    font: 600 16px "Noto Sans KR", sans-serif;
  }
  .stepper input:disabled { opacity: .6; }
  .help { font-size: 12.5px; color: var(--muted); line-height: 1.6; margin: 0; padding: 0 4px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="modes" role="tablist">
    <button id="modePomo" class="active" role="tab">뽀모도로</button>
    <button id="modeTrack" role="tab">타임트래킹</button>
  </div>

  <div class="device">
    <div class="screen" id="screen">
      <svg id="svg" viewBox="0 0 400 400" aria-label="원형 타이머">
        <g id="dial"></g>
        <g id="arc"></g>

        <!-- 소리 아이콘 -->
        <g id="soundBtn" class="clickable" transform="translate(356 26)">
          <rect x="-8" y="-8" width="32" height="32" fill="transparent"/>
          <path d="M0 5h4l5-5v16l-5-5H0z" fill="var(--digit)"/>
          <path id="soundWave" d="M12 3.5a6 6 0 0 1 0 9" stroke="var(--digit)" stroke-width="1.6" fill="none"/>
          <path id="soundMute" d="M11 4l6 8M17 4l-6 8" stroke="var(--digit)" stroke-width="1.6" class="hidden"/>
        </g>

        <!-- 뽀모도로 화면 -->
        <g id="pomoView" class="glow">
          <text id="cycleText" class="digits" x="200" y="146" text-anchor="middle" font-size="22">00/03</text>
          <text id="phaseText" class="unit" x="200" y="164" text-anchor="middle">집중</text>
          <text id="focusText" class="digits clickable" x="200" y="222" text-anchor="middle" font-size="68">25:00</text>
          <text class="unit" x="185" y="238" text-anchor="middle">M</text>
          <text class="unit" x="215" y="238" text-anchor="middle">S</text>
          <text id="breakText" class="digits digits-sub" x="200" y="280" text-anchor="middle" font-size="40">05:00</text>
        </g>

        <!-- 타임트래킹 화면 -->
        <g id="trackView" class="glow hidden">
          <text class="unit" x="167" y="170" text-anchor="middle" font-size="12">H</text>
          <text class="unit" x="233" y="170" text-anchor="middle" font-size="12">M</text>
          <text id="trackText" class="digits" x="200" y="228" text-anchor="middle" font-size="72">00:00</text>
          <text id="trackSec" class="digits digits-sub" x="200" y="262" text-anchor="middle" font-size="20">00s</text>
          <text id="trackState" class="unit" x="200" y="284" text-anchor="middle" font-size="12">대기</text>
        </g>
      </svg>
    </div>
    <div class="brand">focus timer</div>
  </div>

  <div class="controls">
    <button id="startBtn" class="primary">시작</button>
    <button id="resetBtn">리셋</button>
  </div>

  <div class="panel" id="pomoPanel">
    <div class="row">
      <span class="label">반복 횟수<span class="hint">목표 세트 수 (1–99)</span></span>
      <div class="stepper" data-key="target" data-min="1" data-max="99">
        <button data-d="-1" aria-label="감소">−</button><input type="number" inputmode="numeric"><button data-d="1" aria-label="증가">+</button>
      </div>
    </div>
    <div class="row">
      <span class="label">집중 시간<span class="hint">분 (1–60)</span></span>
      <div class="stepper" data-key="focusMin" data-min="1" data-max="60">
        <button data-d="-1" aria-label="감소">−</button><input type="number" inputmode="numeric"><button data-d="1" aria-label="증가">+</button>
      </div>
    </div>
    <div class="row">
      <span class="label">휴식 시간<span class="hint">분 (1–60)</span></span>
      <div class="stepper" data-key="breakMin" data-min="1" data-max="60">
        <button data-d="-1" aria-label="감소">−</button><input type="number" inputmode="numeric"><button data-d="1" aria-label="증가">+</button>
      </div>
    </div>
  </div>

  <p class="help" id="pomoHelp">
    집중 시간이 끝나면 휴식이 자동으로 시작되고, 한 세트가 끝날 때마다 위쪽 왼쪽 숫자(완료 횟수)가 올라갑니다.
    정지 상태에서 다이얼을 드래그하거나 큰 숫자 위에서 스크롤해도 집중 시간을 바꿀 수 있어요.
  </p>
  <p class="help hidden" id="trackHelp">
    시작을 누르면 순수 집중 시간이 누적되고, 일시정지(휴식) 중인 시간은 기록되지 않습니다. 최대 12시간까지 쌓이며 브라우저를 닫아도 기록이 유지됩니다.
  </p>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const C = 200;                       // 중심
  const MAX_TRACK = 12 * 3600 * 1000;  // 12시간
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  // ---------- 상태 ----------
  const saved = store.get("pomoSettings", {});
  const S = {
    mode: "pomo",
    sound: store.get("sound", true),
    pomo: {
      target: clamp(saved.target || 3, 1, 99),
      focusMin: clamp(saved.focusMin || 25, 1, 60),
      breakMin: clamp(saved.breakMin || 5, 1, 60),
      done: 0,
      phase: "focus",      // focus | break
      remaining: 0,        // 현재 단계 남은 ms
      running: false,
      endAt: 0,
      finished: false
    },
    track: {
      total: clamp(store.get("trackTotal", 0), 0, MAX_TRACK),
      running: false,
      startedAt: 0
    }
  };
  S.pomo.remaining = S.pomo.focusMin * 60000;

  // ---------- 다이얼 그리기 ----------
  const polar = (r, deg) => {
    const a = (deg - 90) * Math.PI / 180;
    return [C + r * Math.cos(a), C + r * Math.sin(a)];
  };

  const dial = $("dial");
  for (let m = 0; m < 60; m += 5) {
    const deg = m * 6;
    const [tx, ty] = polar(172, deg);
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", tx); t.setAttribute("y", ty + 7);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("class", "dial-num");
    t.textContent = m;
    dial.appendChild(t);
    const [dx, dy] = polar(154, deg);
    const d = document.createElementNS(NS, "circle");
    d.setAttribute("cx", dx); d.setAttribute("cy", dy); d.setAttribute("r", 1.8);
    d.setAttribute("class", "dial-dot");
    dial.appendChild(d);
  }

  // 60개 분할 세그먼트
  const R_IN = 116, R_OUT = 142;
  const arc = $("arc");
  const segs = [];
  for (let i = 0; i < 60; i++) {
    const a0 = i * 6 + 0.7, a1 = (i + 1) * 6 - 0.7;
    const [x0, y0] = polar(R_OUT, a0), [x1, y1] = polar(R_OUT, a1);
    const [x2, y2] = polar(R_IN, a1),  [x3, y3] = polar(R_IN, a0);
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", `M${x0} ${y0}A${R_OUT} ${R_OUT} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${R_IN} ${R_IN} 0 0 0 ${x3} ${y3}Z`);
    p.setAttribute("fill", "var(--arc-off)");
    arc.appendChild(p);
    segs.push(p);
  }
  let lastArc = "";
  function drawArc(count, color) {
    const key = count + color;
    if (key === lastArc) return;
    lastArc = key;
    segs.forEach((p, i) => p.setAttribute("fill", i < count ? color : "var(--arc-off)"));
  }

  // ---------- 소리 ----------
  let actx;
  function beep(times = 3) {
    if (!S.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      for (let i = 0; i < times; i++) {
        const o = actx.createOscillator(), g = actx.createGain();
        const t = actx.currentTime + i * 0.35;
        o.frequency.value = 880; o.type = "sine";
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
        o.connect(g).connect(actx.destination);
        o.start(t); o.stop(t + 0.3);
      }
    } catch {}
  }
  function renderSound() {
    $("soundWave").classList.toggle("hidden", !S.sound);
    $("soundMute").classList.toggle("hidden", S.sound);
  }
  $("soundBtn").addEventListener("click", () => {
    S.sound = !S.sound; store.set("sound", S.sound); renderSound();
    if (S.sound) beep(1);
  });

  // ---------- 뽀모도로 ----------
  const P = S.pomo;
  const fmtMS = ms => {
    const s = Math.ceil(ms / 1000);
    return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
  };

  function pomoStep(now) {
    if (!P.running) return;
    P.remaining = P.endAt - now;
    while (P.running && P.remaining <= 0) {
      const over = -P.remaining;
      if (P.phase === "focus") {
        P.done = Math.min(99, P.done + 1);
        if (P.done >= P.target) {       // 목표 달성
          P.running = false;
          P.finished = true;
          P.phase = "focus";
          P.remaining = P.focusMin * 60000;
          beep(5);
          break;
        }
        P.phase = "break";
        P.remaining = P.breakMin * 60000 - over;
      } else {
        P.phase = "focus";
        P.remaining = P.focusMin * 60000 - over;
      }
      P.endAt = now + P.remaining;
      beep(3);
    }
  }

  function renderPomo() {
    const focusMs = P.phase === "focus" ? P.remaining : P.focusMin * 60000;
    const breakMs = P.phase === "break" ? P.remaining : P.breakMin * 60000;
    $("cycleText").textContent = `${pad(P.done)}/${pad(P.target)}`;
    $("focusText").textContent = fmtMS(focusMs);
    $("breakText").textContent = fmtMS(breakMs);

    const paused = !P.running && !P.finished && (P.phase === "break" || P.remaining !== P.focusMin * 60000);
    const phase = P.phase === "focus" ? "집중" : "휴식";
    $("phaseText").textContent = P.finished ? "완료!" : P.running ? phase : paused ? phase + " · 일시정지" : "대기";

    // 진행 중인 단계만 밝게
    $("focusText").style.opacity = P.phase === "focus" ? 1 : 0.45;
    $("breakText").style.opacity = P.phase === "break" ? 1 : 0.55;
    $("breakText").setAttribute("font-size", P.phase === "break" ? 44 : 40);
    $(P.phase === "focus" ? "focusText" : "breakText").classList.toggle("blink", paused);
    $(P.phase === "focus" ? "breakText" : "focusText").classList.remove("blink");

    const mins = Math.ceil(Math.max(0, P.remaining) / 60000);
    drawArc(mins, P.phase === "focus" ? "var(--arc-on)" : "var(--arc-break)");
  }

  // ---------- 타임트래킹 ----------
  const T = S.track;
  const trackElapsed = now => Math.min(MAX_TRACK, T.total + (T.running ? now - T.startedAt : 0));

  function trackStep(now) {
    if (T.running && trackElapsed(now) >= MAX_TRACK) {
      T.total = MAX_TRACK; T.running = false;
      store.set("trackTotal", T.total);
      beep(5);
    }
  }
  function renderTrack(now) {
    const ms = trackElapsed(now);
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600), m = Math.floor(totalSec / 60) % 60;
    $("trackText").textContent = `${pad(h)}:${pad(m)}`;
    $("trackSec").textContent = `${pad(totalSec % 60)}s`;
    $("trackState").textContent = ms >= MAX_TRACK ? "최대 12시간 도달"
      : T.running ? "집중 중" : ms > 0 ? "휴식 중 (기록 제외)" : "대기";
    $("trackText").classList.toggle("blink", !T.running && ms > 0 && ms < MAX_TRACK);
    drawArc(ms >= MAX_TRACK ? 60 : m, "var(--arc-on)");
  }

  // ---------- 공통 렌더 ----------
  function render() {
    const now = Date.now();
    const pomo = S.mode === "pomo";
    $("pomoView").classList.toggle("hidden", !pomo);
    $("trackView").classList.toggle("hidden", pomo);
    $("pomoPanel").classList.toggle("hidden", !pomo);
    $("pomoHelp").classList.toggle("hidden", !pomo);
    $("trackHelp").classList.toggle("hidden", pomo);
    $("modePomo").classList.toggle("active", pomo);
    $("modeTrack").classList.toggle("active", !pomo);

    const running = pomo ? P.running : T.running;
    $("startBtn").textContent = running ? (pomo ? "일시정지" : "휴식 (일시정지)") : "시작";
    lockSettings(P.running);
    if (pomo) renderPomo(); else renderTrack(now);
  }

  function loop() {
    const now = Date.now();
    pomoStep(now);
    trackStep(now);
    render();
  }
  setInterval(loop, 200);
  document.addEventListener("visibilitychange", loop);

  // ---------- 버튼 ----------
  function toggleStart() {
    const now = Date.now();
    if (S.mode === "pomo") {
      if (P.running) {
        pomoStep(now);
        P.running = false;
      } else {
        if (P.finished || P.done >= P.target) { P.finished = false; P.done = 0; }
        P.running = true;
        P.endAt = now + P.remaining;
      }
    } else {
      if (T.running) {
        T.total = trackElapsed(now); T.running = false;
        store.set("trackTotal", T.total);
      } else if (T.total < MAX_TRACK) {
        T.running = true; T.startedAt = now;
      }
    }
    // 오디오 컨텍스트는 사용자 동작으로 열어둠
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch {}
    render();
  }
  function reset() {
    if (S.mode === "pomo") {
      Object.assign(P, { running: false, finished: false, done: 0, phase: "focus", remaining: P.focusMin * 60000 });
    } else {
      if (T.total > 0 || T.running) {
        if (!confirm("누적된 집중 시간을 초기화할까요?")) return;
      }
      Object.assign(T, { running: false, total: 0 });
      store.set("trackTotal", 0);
    }
    render();
  }
  $("startBtn").addEventListener("click", toggleStart);
  $("resetBtn").addEventListener("click", reset);
  $("modePomo").addEventListener("click", () => { S.mode = "pomo"; render(); });
  $("modeTrack").addEventListener("click", () => { S.mode = "track"; render(); });
  document.addEventListener("keydown", e => {
    if (e.code === "Space" && e.target.tagName !== "INPUT" && e.target.tagName !== "BUTTON") {
      e.preventDefault(); toggleStart();
    }
  });
  window.addEventListener("beforeunload", () => {
    if (T.running) { T.total = trackElapsed(Date.now()); store.set("trackTotal", T.total); }
  });

  // ---------- 설정 ----------
  const steppers = [...document.querySelectorAll(".stepper")];
  function setSetting(key, val) {
    if (P.running) return;
    const st = steppers.find(s => s.dataset.key === key);
    val = clamp(Math.round(Number(val) || 0), +st.dataset.min, +st.dataset.max);
    P[key] = val;
    if (key === "focusMin" && P.phase === "focus") P.remaining = val * 60000;
    if (key === "breakMin" && P.phase === "break") P.remaining = val * 60000;
    if (key === "target") P.finished = false;
    store.set("pomoSettings", { target: P.target, focusMin: P.focusMin, breakMin: P.breakMin });
    syncInputs();
    render();
  }
  function syncInputs() {
    steppers.forEach(st => {
      const inp = st.querySelector("input");
      if (document.activeElement !== inp) inp.value = P[st.dataset.key];
    });
  }
  function lockSettings(lock) {
    steppers.forEach(st => st.querySelectorAll("button, input").forEach(el => { el.disabled = lock; }));
  }
  steppers.forEach(st => {
    const key = st.dataset.key, inp = st.querySelector("input");
    st.querySelectorAll("button").forEach(b => {
      b.addEventListener("click", () => setSetting(key, P[key] + Number(b.dataset.d)));
    });
    inp.addEventListener("change", () => setSetting(key, inp.value));
    inp.addEventListener("blur", syncInputs);
  });
  syncInputs();

  // 큰 숫자 위 스크롤 → 집중 시간 조절
  $("focusText").addEventListener("wheel", e => {
    if (S.mode !== "pomo" || P.running) return;
    e.preventDefault();
    setSetting("focusMin", P.focusMin + (e.deltaY < 0 ? 1 : -1));
  }, { passive: false });

  // 다이얼 드래그 → 집중 시간 설정 (물리 타이머처럼)
  const svg = $("svg");
  let dragging = false;
  function dialMinutes(e) {
    const r = svg.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * 400 - C;
    const y = (e.clientY - r.top) / r.height * 400 - C;
    const dist = Math.hypot(x, y);
    let deg = Math.atan2(y, x) * 180 / Math.PI + 90;
    if (deg < 0) deg += 360;
    return { dist, min: Math.round(deg / 6) || 60 };
  }
  svg.addEventListener("pointerdown", e => {
    if (S.mode !== "pomo" || P.running || P.phase !== "focus") return;
    const { dist, min } = dialMinutes(e);
    if (dist < R_IN - 8 || dist > 190) return;
    dragging = true;
    svg.setPointerCapture(e.pointerId);
    setSetting("focusMin", min);
  });
  svg.addEventListener("pointermove", e => {
    if (!dragging) return;
    let { min } = dialMinutes(e);
    // 0 근처에서 60 ↔ 1로 튀지 않도록 보정
    if (P.focusMin >= 50 && min <= 10) min = 60;
    else if (P.focusMin <= 10 && min >= 50) min = 1;
    setSetting("focusMin", min);
  });
  const endDrag = () => { dragging = false; };
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);

  renderSound();
  render();
})();
</script>
</body>
</html>
