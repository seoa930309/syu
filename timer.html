<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #d9d9d9;
    --bg: #f2f2f2;
    --ink: #111111;
    --muted: #6b6b6b;
    --line: #111111;
    --soft-line: #cfcfcf;
    --inv-bg: #141414;
    --inv-ink: #f2f2f2;
    --inv-line: #5a5a5a;
    --screen: #0a0a0a;
    --digit: #f5f5f5;
    --digit-dim: #9a9a9a;
    --arc-on: #f5f5f5;
    --arc-break: #8c8c8c;
    --arc-track: #f5f5f5;
    --arc-off: #1e1e1e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #000000;
      --bg: #111111;
      --ink: #f2f2f2;
      --muted: #9a9a9a;
      --line: #f2f2f2;
      --soft-line: #3a3a3a;
      --inv-bg: #f2f2f2;
      --inv-ink: #111111;
      --inv-line: #9a9a9a;
    }
  }
  :root[data-theme="dark"] {
    --page: #000000;
    --bg: #111111;
    --ink: #f2f2f2;
    --muted: #9a9a9a;
    --line: #f2f2f2;
    --soft-line: #3a3a3a;
    --inv-bg: #f2f2f2;
    --inv-ink: #111111;
    --inv-line: #9a9a9a;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: "Manrope", "Noto Sans KR", system-ui, sans-serif;
    padding: 32px 16px;
  }
  button, select, input { font-family: inherit; }
  .page {
    max-width: 1040px; margin: 0 auto; background: var(--bg);
    box-shadow: 0 30px 60px rgba(0,0,0,.25);
  }
  .tag { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  /* 상단 바 */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 32px;
  }
  .logo { width: 22px; height: 22px; flex: none; }
  nav { display: flex; gap: 22px; margin-right: auto; margin-left: 28px; }
  nav button {
    background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--muted);
    font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    border-bottom: 1px solid transparent;
  }
  nav button.active { color: var(--ink); border-bottom-color: var(--ink); }
  .btn-black {
    background: var(--ink); color: var(--bg); border: 1px solid var(--ink);
    font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    padding: 9px 18px; cursor: pointer; text-decoration: none; border-radius: 2px;
  }
  .btn-line {
    background: transparent; color: var(--ink); border: 1px solid var(--ink);
    font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    padding: 9px 18px; cursor: pointer; border-radius: 2px;
  }
  .btn-black:hover { opacity: .85; }
  .btn-line:hover { background: var(--ink); color: var(--bg); }

  h1 {
    margin: 0; padding: 4px 24px 14px; text-align: center;
    font-family: "Manrope", sans-serif; font-weight: 500; letter-spacing: -.02em; line-height: .95;
    font-size: clamp(48px, 12.5vw, 132px); text-transform: uppercase;
    border-bottom: 1px solid var(--line);
  }

  /* 본문 그리드 */
  .grid { display: grid; grid-template-columns: 1.35fr 1fr; border-bottom: 1px solid var(--line); }
  .cell { padding: 36px 32px; min-width: 0; }
  .grid .cell:last-child { display: flex; flex-direction: column; justify-content: center; }
  .cell + .cell { border-left: 1px solid var(--line); }

  /* 타이머 화면 */
  .device { max-width: 480px; margin: 0 auto; user-select: none; }
  .screen {
    background: var(--screen); aspect-ratio: 1 / 1; position: relative; overflow: hidden;
    touch-action: none; border-radius: 5%;
  }
  .screen svg { width: 100%; height: 100%; display: block; }
  .device-cap { display: flex; justify-content: space-between; margin-top: 10px; }

  .dial-num { font: 300 18px "Manrope", sans-serif; fill: var(--digit); }
  .dial-dot { fill: var(--digit); }
  .digits { font-family: "Share Tech Mono", ui-monospace, monospace; fill: var(--digit); }
  .digits-sub { fill: var(--digit-dim); }
  .unit { font: 10px "Noto Sans KR", sans-serif; fill: var(--digit-dim); letter-spacing: .06em; }
  .clickable { cursor: pointer; }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  .glow { filter: drop-shadow(0 0 3px rgba(255,255,255,.3)); }
  #arc { cursor: grab; }
  .dragging #arc { cursor: grabbing; }
  .edit {
    position: absolute; transform: translate(-50%, -50%);
    background: #000; color: var(--digit); caret-color: #fff;
    border: 1px solid #fff; border-radius: 2px; outline: none;
    font-family: "Share Tech Mono", ui-monospace, monospace; text-align: center; padding: 0 4px;
  }
  .edit::placeholder { color: #555; }

  /* 조작 */
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 26px; }
  .controls button { padding: 15px 0; font-size: 12px; }

  .fold { border-top: 1px solid var(--line); }
  .fold:last-child { border-bottom: 1px solid var(--line); }
  .fold summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  }
  .fold summary::-webkit-details-marker { display: none; }
  .fold summary::after { content: "+"; font-size: 18px; font-weight: 300; line-height: 1; }
  .fold[open] summary::after { content: "−"; }
  .fold .ko { font-family: "Noto Sans KR", sans-serif; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); margin-left: 8px; }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 0; border-top: 1px solid var(--soft-line);
    font-family: "Noto Sans KR", sans-serif;
  }
  .row .label { font-size: 13px; font-weight: 500; }
  .ctrl { display: flex; align-items: center; gap: 8px; }
  .row select {
    height: 34px; border: 1px solid var(--ink); border-radius: 2px; background: var(--bg); color: var(--ink);
    font: 400 13px "Noto Sans KR", sans-serif; padding: 0 8px;
  }
  .row .btn-line { padding: 8px 12px; font-family: "Noto Sans KR", sans-serif; letter-spacing: 0; }
  .vol { display: flex; align-items: center; gap: 10px; flex: 1; justify-content: flex-end; }
  .vol input[type=range] { width: 100%; max-width: 150px; accent-color: var(--ink); }
  .vol output { min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
  .swatches { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .swatch {
    width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--soft-line); cursor: pointer; padding: 0;
  }
  .swatch.on { outline: 1px solid var(--ink); outline-offset: 2px; }
  .swatches input[type=color] { width: 26px; height: 26px; border: 0; padding: 0; background: none; cursor: pointer; }
  #settingsPanel.track #soundSection { display: none; }
  #settingsPanel.track .row[data-mode="pomo"], #settingsPanel:not(.track) .row[data-mode="track"] { display: none; }

  footer { display: flex; justify-content: space-between; padding: 14px 32px; }
  .hidden { display: none !important; }

  @media (max-width: 760px) {
    body { padding: 0; }
    header { padding: 12px 16px; }
    nav { margin-left: 12px; gap: 14px; }
    .grid { grid-template-columns: 1fr; }
    .cell { padding: 28px 16px; }
    .cell + .cell { border-left: 0; border-top: 1px solid var(--line); }
    footer { padding: 14px 16px; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
      <circle cx="12" cy="13" r="9"/><path d="M12 13V8M12 13l3.5 2M10 2h4"/>
    </svg>
    <nav role="tablist">
      <button id="modePomo" class="active" role="tab">뽀모도로</button>
      <button id="modeTrack" role="tab">타임트래킹</button>
    </nav>
  </header>

  <h1>Focus Timer</h1>

  <section class="grid">
    <div class="cell">
      <div class="device">
        <div class="screen" id="screen">
          <svg id="svg" viewBox="0 0 400 400" aria-label="원형 타이머">
            <g id="dial"></g>
            <g id="arc"></g>

            <!-- 소리 아이콘 -->
            <g id="soundBtn" class="clickable" transform="translate(356 26)">
              <rect x="-8" y="-8" width="32" height="32" fill="transparent"/>
              <path d="M0 5h4l5-5v16l-5-5H0z" fill="var(--digit)"/>
              <path id="soundWave" d="M12 3.5a6 6 0 0 1 0 9" stroke="var(--digit)" stroke-width="1.6" fill="none"/>
              <path id="soundMute" d="M11 4l6 8M17 4l-6 8" stroke="var(--digit)" stroke-width="1.6" class="hidden"/>
            </g>

            <!-- 뽀모도로 화면 -->
            <g id="pomoView" class="glow">
              <text id="cycleText" class="digits clickable" x="200" y="146" text-anchor="middle" font-size="22"><tspan id="doneText">00</tspan>/<tspan id="targetText">--</tspan></text>
              <text id="phaseText" class="unit" x="200" y="164" text-anchor="middle">집중</text>
              <text id="focusText" class="digits clickable" x="200" y="222" text-anchor="middle" font-size="68">25:00</text>
              <text class="unit" x="185" y="238" text-anchor="middle">M</text>
              <text class="unit" x="215" y="238" text-anchor="middle">S</text>
              <text id="breakText" class="digits digits-sub clickable" x="200" y="280" text-anchor="middle" font-size="40">05:00</text>
            </g>

            <!-- 타임트래킹 화면 -->
            <g id="trackView" class="glow hidden">
              <text id="goalText" class="digits digits-sub clickable" x="200" y="146" text-anchor="middle" font-size="22">목표 --:--</text>
              <text class="unit" x="167" y="170" text-anchor="middle" font-size="12">H</text>
              <text class="unit" x="233" y="170" text-anchor="middle" font-size="12">M</text>
              <text id="trackText" class="digits" x="200" y="228" text-anchor="middle" font-size="72">00:00</text>
              <text id="trackSec" class="digits digits-sub" x="200" y="262" text-anchor="middle" font-size="20">00s</text>
              <text id="trackState" class="unit" x="200" y="284" text-anchor="middle" font-size="12">대기</text>
            </g>
          </svg>
          <input id="editInput" class="edit hidden" type="text" inputmode="numeric" autocomplete="off">
        </div>
        <div class="device-cap"><span class="tag">(Timer)</span><span class="tag" id="modeCap">Pomodoro</span></div>
      </div>
    </div>

    <div class="cell">
      <div class="controls">
        <button id="startBtn" class="btn-black">시작</button>
        <button id="resetBtn" class="btn-line">리셋</button>
      </div>

      <div id="settingsPanel">
        <details id="soundSection" class="fold">
          <summary><span>Sound<span class="ko">소리</span></span></summary>
          <div class="row">
            <span class="label">알림음</span>
            <div class="ctrl">
              <select id="soundType">
                <option value="beep">삐삐</option>
                <option value="digital">디지털 알람</option>
                <option value="chime">차임</option>
                <option value="bell">벨</option>
                <option value="soft">부드러운 음</option>
              </select>
              <button class="btn-line" id="soundTest">미리듣기</button>
            </div>
          </div>
          <div class="row">
            <span class="label">소리 크기</span>
            <div class="vol">
              <input type="range" id="volume" min="0" max="100" step="5">
              <output id="volumeOut">70%</output>
            </div>
          </div>
        </details>
        <details id="colorSection" class="fold">
          <summary><span>Ring<span class="ko">원형 테두리 색</span></span></summary>
          <div class="row" data-mode="pomo">
            <span class="label">집중</span>
            <div class="swatches" data-var="--arc-on" data-key="colorFocus"></div>
          </div>
          <div class="row" data-mode="pomo">
            <span class="label">휴식</span>
            <div class="swatches" data-var="--arc-break" data-key="colorBreak"></div>
          </div>
          <div class="row" data-mode="track">
            <span class="label">트래킹</span>
            <div class="swatches" data-var="--arc-track" data-key="colorTrack"></div>
          </div>
        </details>
      </div>
    </div>
  </section>

  <footer><span class="tag">Focus Timer</span><span class="tag">Black &amp; White</span></footer>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const C = 200;                       // 중심
  const MAX_TRACK = 12 * 3600 * 1000;  // 12시간
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  // ---------- 상태 ----------
  const saved = store.get("pomoSettings", {});
  const S = {
    mode: "pomo",
    sound: store.get("sound", true),
    pomo: {
      target: saved.target ? clamp(saved.target, 1, 99) : null,   // null = 목표 없이 카운트만
      focusSec: clamp(saved.focusSec || (saved.focusMin || 25) * 60, 1, 3600),   // 집중 시간(초)
      breakSec: clamp(saved.breakSec || (saved.breakMin || 5) * 60, 1, 3600),   // 휴식 시간(초)
      done: 0,
      phase: "focus",      // focus | break
      remaining: 0,        // 현재 단계 남은 ms
      running: false,
      endAt: 0,
      finished: false
    },
    track: {
      total: clamp(store.get("trackTotal", 0), 0, MAX_TRACK),
      running: false,
      startedAt: 0,
      goalMin: store.get("trackGoal", null),   // 목표(분), null = 목표 없음
      goalHit: false
    }
  };
  S.pomo.remaining = S.pomo.focusSec * 1000;

  // ---------- 다이얼 그리기 ----------
  const polar = (r, deg) => {
    const a = (deg - 90) * Math.PI / 180;
    return [C + r * Math.cos(a), C + r * Math.sin(a)];
  };

  const dial = $("dial");
  for (let m = 0; m < 60; m += 5) {
    const deg = m * 6;
    const [tx, ty] = polar(172, deg);
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", tx); t.setAttribute("y", ty + 7);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("class", "dial-num");
    t.textContent = m;
    dial.appendChild(t);
    const [dx, dy] = polar(154, deg);
    const d = document.createElementNS(NS, "circle");
    d.setAttribute("cx", dx); d.setAttribute("cy", dy); d.setAttribute("r", 1.8);
    d.setAttribute("class", "dial-dot");
    dial.appendChild(d);
  }

  // 60개 분할 세그먼트
  const R_IN = 116, R_OUT = 142;
  const arc = $("arc");
  const segs = [];
  for (let i = 0; i < 60; i++) {
    const a0 = i * 6 + 0.7, a1 = (i + 1) * 6 - 0.7;
    const [x0, y0] = polar(R_OUT, a0), [x1, y1] = polar(R_OUT, a1);
    const [x2, y2] = polar(R_IN, a1),  [x3, y3] = polar(R_IN, a0);
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", `M${x0} ${y0}A${R_OUT} ${R_OUT} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${R_IN} ${R_IN} 0 0 0 ${x3} ${y3}Z`);
    p.setAttribute("fill", "var(--arc-off)");
    arc.appendChild(p);
    segs.push(p);
  }
  let lastArc = "";
  function drawArc(count, color) {
    const key = count + color;
    if (key === lastArc) return;
    lastArc = key;
    segs.forEach((p, i) => p.setAttribute("fill", i < count ? color : "var(--arc-off)"));
  }

  // ---------- 소리 ----------
  const SND = store.get("soundPrefs", {});
  S.soundType = SND.type || "beep";
  S.volume = SND.volume ?? 70;
  let actx;
  function audio() {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  // 한 음: 시작 시각, 주파수, 파형, 길이, 세기, 어택
  function tone(out, t, freq, type, dur, peak, attack = 0.01) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(out);
    o.start(t); o.stop(t + dur + 0.05);
  }
  // 알림음 종류별 한 묶음의 소리와 간격(초)
  const SOUNDS = {
    beep:    { gap: 0.35, play: (o, t) => tone(o, t, 880, "sine", 0.25, 0.6) },
    digital: { gap: 0.6,  play: (o, t) => { for (let i = 0; i < 4; i++) tone(o, t + i * 0.08, 2000, "square", 0.05, 0.12, 0.003); } },
    chime:   { gap: 0.7,  play: (o, t) => { tone(o, t, 659, "sine", 0.9, 0.5); tone(o, t + 0.18, 988, "sine", 1.0, 0.45); } },
    bell:    { gap: 1.1,  play: (o, t) => { tone(o, t, 523, "sine", 1.6, 0.55, 0.005); tone(o, t, 1318, "sine", 0.9, 0.2, 0.005); tone(o, t, 2093, "sine", 0.4, 0.08, 0.005); } },
    soft:    { gap: 0.8,  play: (o, t) => tone(o, t, 440, "triangle", 0.7, 0.55, 0.12) }
  };
  const ALARM_REPEAT = 3;   // 알람은 3번 울리고 자동으로 꺼짐
  function beep(times = ALARM_REPEAT, force = false) {
    if ((!S.sound && !force) || S.volume <= 0) return;
    try {
      audio();
      const master = actx.createGain();
      master.gain.value = (S.volume / 100) ** 2;   // 귀로 듣기에 자연스러운 볼륨 곡선
      master.connect(actx.destination);
      const snd = SOUNDS[S.soundType] || SOUNDS.beep;
      for (let i = 0; i < times; i++) snd.play(master, actx.currentTime + 0.02 + i * snd.gap);
    } catch {}
  }
  function renderSound() {
    $("soundWave").classList.toggle("hidden", !S.sound);
    $("soundMute").classList.toggle("hidden", S.sound);
  }
  $("soundBtn").addEventListener("click", () => {
    S.sound = !S.sound; store.set("sound", S.sound); renderSound();
    if (S.sound) beep(1);
  });

  const saveSound = () => store.set("soundPrefs", { type: S.soundType, volume: S.volume });
  $("soundType").value = S.soundType;
  $("volume").value = S.volume;
  $("volumeOut").textContent = S.volume + "%";
  $("soundType").addEventListener("change", e => { S.soundType = e.target.value; saveSound(); beep(1, true); });
  $("volume").addEventListener("input", e => { S.volume = +e.target.value; $("volumeOut").textContent = S.volume + "%"; saveSound(); });
  $("volume").addEventListener("change", () => beep(1, true));
  $("soundTest").addEventListener("click", () => beep(ALARM_REPEAT, true));

  // ---------- 테두리 색 ----------
  const PALETTE = ["#f5f5f5", "#d4d4d4", "#b0b0b0", "#8c8c8c", "#686868", "#4a4a4a"];   // 흑백 톤
  const COLORS = store.get("ringColorsBW", {});
  document.querySelectorAll(".swatches").forEach(box => {
    const cssVar = box.dataset.var, key = box.dataset.key;
    const def = getComputedStyle(document.documentElement).getPropertyValue(cssVar).trim();
    const picker = document.createElement("input");
    picker.type = "color"; picker.title = "직접 고르기";
    const chips = PALETTE.map(c => {
      const b = document.createElement("button");
      b.className = "swatch"; b.style.background = c; b.title = c; b.dataset.c = c;
      b.addEventListener("click", () => apply(c));
      box.appendChild(b);
      return b;
    });
    box.appendChild(picker);
    picker.addEventListener("input", () => apply(picker.value));
    function apply(c) {
      document.documentElement.style.setProperty(cssVar, c);
      chips.forEach(b => b.classList.toggle("on", b.dataset.c === c.toLowerCase()));
      picker.value = c;
      COLORS[key] = c; store.set("ringColorsBW", COLORS);
      lastArc = "";   // 원호 다시 칠하기
      render && render();
    }
    const init = COLORS[key] || def;
    document.documentElement.style.setProperty(cssVar, init);
    chips.forEach(b => b.classList.toggle("on", b.dataset.c === init.toLowerCase()));
    picker.value = init;
  });

  // 접기/펼치기 상태 기억
  [["soundSection", "soundOpen"], ["colorSection", "colorOpen"]].forEach(([id, key]) => {
    const el = $(id);
    el.open = store.get(key, false);
    el.addEventListener("toggle", () => store.set(key, el.open));
  });

  // ---------- 뽀모도로 ----------
  const P = S.pomo;
  const fmtMS = ms => {
    const s = Math.ceil(ms / 1000);
    return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
  };

  function pomoStep(now) {
    if (!P.running) return;
    P.remaining = P.endAt - now;
    while (P.running && P.remaining <= 0) {
      const over = -P.remaining;
      if (P.phase === "focus") {
        P.done = Math.min(99, P.done + 1);
        if (P.target && P.done >= P.target) {       // 목표 달성
          P.running = false;
          P.finished = true;
          P.phase = "focus";
          P.remaining = 0;               // 다 끝나면 00:00으로
          beep(ALARM_REPEAT);
          break;
        }
        P.phase = "break";
        P.remaining = P.breakSec * 1000 - over;
      } else {
        P.phase = "focus";
        P.remaining = P.focusSec * 1000 - over;
      }
      P.endAt = now + P.remaining;
      beep(ALARM_REPEAT);
    }
  }

  function renderPomo() {
    // 끝난 단계는 00:00으로 표시
    const focusMs = P.phase === "focus" ? P.remaining : 0;
    const breakMs = P.finished ? 0 : P.phase === "break" ? P.remaining : P.breakSec * 1000;
    $("doneText").textContent = pad(P.done);
    $("targetText").textContent = P.target ? pad(P.target) : "--";
    $("focusText").textContent = fmtMS(focusMs);
    $("breakText").textContent = fmtMS(breakMs);

    const paused = !P.running && !P.finished && (P.phase === "break" || P.remaining !== P.focusSec * 1000);
    const phase = P.phase === "focus" ? "집중" : "휴식";
    $("phaseText").textContent = P.finished ? "완료!" : P.running ? phase : paused ? phase + " · 일시정지" : "대기";

    // 진행 중인 단계만 밝게
    $("focusText").style.opacity = P.phase === "focus" && !P.finished ? 1 : 0.45;
    $("breakText").style.opacity = P.phase === "break" ? 1 : 0.55;
    $("breakText").setAttribute("font-size", P.phase === "break" ? 44 : 40);
    $(P.phase === "focus" ? "focusText" : "breakText").classList.toggle("blink", paused);
    $(P.phase === "focus" ? "breakText" : "focusText").classList.remove("blink");

    const mins = Math.ceil(Math.max(0, P.remaining) / 60000);
    drawArc(mins, P.phase === "focus" ? "var(--arc-on)" : "var(--arc-break)");
  }

  // ---------- 타임트래킹 ----------
  const T = S.track;
  const trackElapsed = now => Math.min(MAX_TRACK, T.total + (T.running ? now - T.startedAt : 0));

  function trackStep(now) {
    if (T.running && T.goalMin && !T.goalHit && trackElapsed(now) >= T.goalMin * 60000) {
      T.goalHit = true;
      beep(ALARM_REPEAT);
    }
    if (T.running && trackElapsed(now) >= MAX_TRACK) {
      T.total = MAX_TRACK; T.running = false;
      store.set("trackTotal", T.total);
      beep(ALARM_REPEAT);
    }
  }
  function renderTrack(now) {
    const ms = trackElapsed(now);
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600), m = Math.floor(totalSec / 60) % 60;
    $("trackText").textContent = `${pad(h)}:${pad(m)}`;
    $("trackSec").textContent = `${pad(totalSec % 60)}s`;
    const hit = T.goalMin && ms >= T.goalMin * 60000;
    $("trackState").textContent = ms >= MAX_TRACK ? "최대 12시간 도달"
      : (hit ? "목표 달성! · " : "") + (T.running ? "집중 중" : ms > 0 ? "휴식 중 (기록 제외)" : "대기");
    $("goalText").textContent = "목표 " + (T.goalMin ? `${pad(Math.floor(T.goalMin / 60))}:${pad(T.goalMin % 60)}` : "--:--");
    $("goalText").style.fill = hit ? "var(--arc-track)" : "";
    $("trackText").classList.toggle("blink", !T.running && ms > 0 && ms < MAX_TRACK);
    // 목표가 있으면 진행률, 없으면 현재 시간 안의 분
    const segs = T.goalMin ? Math.min(60, Math.floor(ms / (T.goalMin * 60000) * 60)) : (ms >= MAX_TRACK ? 60 : m);
    drawArc(segs, "var(--arc-track)");
  }

  // ---------- 공통 렌더 ----------
  function render() {
    const now = Date.now();
    const pomo = S.mode === "pomo";
    $("pomoView").classList.toggle("hidden", !pomo);
    $("trackView").classList.toggle("hidden", pomo);
    $("settingsPanel").classList.toggle("track", !pomo);
    $("modePomo").classList.toggle("active", pomo);
    $("modeTrack").classList.toggle("active", !pomo);
    $("modeCap").textContent = pomo ? "Pomodoro" : "Time Tracking";

    const running = pomo ? P.running : T.running;
    $("startBtn").textContent = running ? (pomo ? "일시정지" : "휴식 (일시정지)") : "시작";
    if (pomo) renderPomo(); else renderTrack(now);
  }

  function loop() {
    const now = Date.now();
    pomoStep(now);
    trackStep(now);
    render();
  }
  setInterval(loop, 200);
  document.addEventListener("visibilitychange", loop);

  // ---------- 버튼 ----------
  function toggleStart() {
    const now = Date.now();
    if (S.mode === "pomo") {
      if (P.running) {
        pomoStep(now);
        P.running = false;
      } else {
        if (P.finished || (P.target && P.done >= P.target)) {
          P.finished = false; P.done = 0; P.phase = "focus"; P.remaining = P.focusSec * 1000;
        }
        P.running = true;
        P.endAt = now + P.remaining;
      }
    } else {
      if (T.running) {
        T.total = trackElapsed(now); T.running = false;
        store.set("trackTotal", T.total);
      } else if (T.total < MAX_TRACK) {
        T.running = true; T.startedAt = now;
      }
    }
    // 오디오 컨텍스트는 사용자 동작으로 열어둠
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch {}
    render();
  }
  function reset() {
    if (S.mode === "pomo") {
      Object.assign(P, { running: false, finished: false, done: 0, phase: "focus", remaining: P.focusSec * 1000 });
    } else {
      if (T.total > 0 || T.running) {
        if (!confirm("누적된 집중 시간을 초기화할까요?")) return;
      }
      Object.assign(T, { running: false, total: 0, goalHit: false });
      store.set("trackTotal", 0);
    }
    render();
  }
  $("startBtn").addEventListener("click", toggleStart);
  $("resetBtn").addEventListener("click", reset);
  $("modePomo").addEventListener("click", () => { closeEdit(false); S.mode = "pomo"; render(); });
  $("modeTrack").addEventListener("click", () => { closeEdit(false); S.mode = "track"; render(); });
  document.addEventListener("keydown", e => {
    if (e.code === "Space" && e.target.tagName !== "INPUT" && e.target.tagName !== "BUTTON") {
      e.preventDefault(); toggleStart();
    }
  });
  window.addEventListener("beforeunload", () => {
    if (T.running) { T.total = trackElapsed(Date.now()); store.set("trackTotal", T.total); }
  });

  // ---------- 설정 ----------
  const LIMITS = { target: [1, 99], focusSec: [1, 3600], breakSec: [1, 3600] };
  function setSetting(key, val) {
    if (key === "target") {
      P.target = val ? clamp(Math.round(val), ...LIMITS.target) : null;
      P.finished = false;
    } else {
      if (P.running) return;
      P[key] = clamp(Math.round(val), ...LIMITS[key]);
      if (key === "focusSec") {
        P.finished = false;
        if (P.phase === "focus") P.remaining = P[key] * 1000;
      }
      if (key === "breakSec" && P.phase === "break") P.remaining = P[key] * 1000;
    }
    store.set("pomoSettings", { target: P.target, focusSec: P.focusSec, breakSec: P.breakSec });
    render();
  }
  function setGoal(min) {
    const ms = trackElapsed(Date.now());
    T.goalMin = min ? clamp(Math.round(min), 1, 720) : null;
    T.goalHit = !!T.goalMin && ms >= T.goalMin * 60000;   // 이미 넘긴 목표는 다시 울리지 않음
    store.set("trackGoal", T.goalMin);
    render();
  }

  // 화면 숫자를 눌러 직접 입력 (휴식 시간, 반복 횟수)
  const screen = $("screen"), editInput = $("editInput");
  let editKey = null;
  function openEdit(key, anchorEl, fontPx) {
    if ((key === "trackGoal") !== (S.mode === "track")) return;
    if ((key === "breakSec" || key === "focusSec") && P.running) return;
    const sr = screen.getBoundingClientRect(), ar = anchorEl.getBoundingClientRect();
    const k = sr.width / 400;
    editKey = key;
    editInput.style.left = (ar.left + ar.width / 2 - sr.left) + "px";
    editInput.style.top = (ar.top + ar.height / 2 - sr.top) + "px";
    editInput.style.fontSize = fontPx * k + "px";
    editInput.style.width = fontPx * k * (key === "target" ? 2.2 : key === "trackGoal" ? 4 : 3.2) + "px";
    editInput.style.height = fontPx * k * 1.35 + "px";
    editInput.style.setProperty("--edit-accent", key === "trackGoal" ? "var(--arc-track)" : "var(--arc-on)");
    editInput.placeholder = key === "target" ? "--" : key === "trackGoal" ? "시:분" : "분:초";
    editInput.maxLength = key === "target" ? 2 : 5;
    editInput.value = key === "target" ? (P.target || "")
      : key === "trackGoal" ? (T.goalMin ? fmtSec(T.goalMin) : "")
      : fmtSec(P[key]);
    editInput.classList.remove("hidden");
    editInput.focus();
    editInput.select();
  }
  function closeEdit(commit) {
    if (!editKey) return;
    const key = editKey, raw = editInput.value.trim();
    editKey = null;
    editInput.classList.add("hidden");
    if (!commit) return;
    if (key === "target") {
      const n = parseInt(raw, 10);
      setSetting("target", n > 0 ? n : null);   // 비우면 목표 해제
    } else if (key === "trackGoal") {
      setGoal(parseMS(raw));   // 시:분 → 분, 비우면 목표 해제
    } else {
      const sec = parseMS(raw);
      if (sec > 0) setSetting(key, sec);
    }
  }
  const fmtSec = sec => `${pad(Math.floor(sec / 60))}:${pad(sec % 60)}`;
  // "4:30" / "430" / "0430" → 270초, "5" → 5분
  function parseMS(raw) {
    if (!raw) return 0;
    let m, sec;
    if (raw.includes(":")) {
      const [a, b] = raw.split(":");
      m = parseInt(a || "0", 10); sec = parseInt(b || "0", 10);
    } else if (raw.length >= 3) {
      m = parseInt(raw.slice(0, -2), 10); sec = parseInt(raw.slice(-2), 10);
    } else {
      m = parseInt(raw, 10); sec = 0;
    }
    if (isNaN(m)) m = 0;
    if (isNaN(sec)) sec = 0;
    return m * 60 + Math.min(sec, 59);
  }
  editInput.addEventListener("input", () => {
    const re = editKey === "target" ? /\D/g : /[^\d:]/g;
    editInput.value = editInput.value.replace(re, "");
  });
  editInput.addEventListener("keydown", e => {
    if (editKey && editKey !== "target" && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
      e.preventDefault();
      const dir = e.key === "ArrowUp" ? 1 : -1;
      const cur = parseMS(editInput.value.trim());
      let next;
      if (editKey === "trackGoal") next = clamp((cur || T.goalMin || 0) + dir, 1, 720);   // 1분씩
      else next = clamp((cur || P[editKey]) + dir, 1, 3600);                                // 1초씩
      editInput.value = fmtSec(next);
      editInput.select();
    }
    else if (e.key === "Enter") { e.preventDefault(); closeEdit(true); }
    else if (e.key === "Escape") { e.preventDefault(); closeEdit(false); }
  });
  editInput.addEventListener("blur", () => closeEdit(true));
  $("cycleText").addEventListener("click", () => openEdit("target", $("targetText"), 22));
  $("breakText").addEventListener("click", () => openEdit("breakSec", $("breakText"), 40));
  $("focusText").addEventListener("click", () => openEdit("focusSec", $("focusText"), 68));
  $("goalText").addEventListener("click", () => openEdit("trackGoal", $("goalText"), 22));

  // 다이얼 드래그 → 집중 시간 설정 (물리 타이머처럼)
  const svg = $("svg");
  let dragging = false;
  function dialMinutes(e) {
    const r = svg.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * 400 - C;
    const y = (e.clientY - r.top) / r.height * 400 - C;
    const dist = Math.hypot(x, y);
    let deg = Math.atan2(y, x) * 180 / Math.PI + 90;
    if (deg < 0) deg += 360;
    return { dist, min: Math.round(deg / 6) || 60 };
  }
  svg.addEventListener("pointerdown", e => {
    if (S.mode === "pomo" && (P.running || P.phase !== "focus")) return;
    const { dist, min } = dialMinutes(e);
    if (dist < R_IN - 8 || dist > 190) return;
    closeEdit(true);
    dragging = true;
    lastDial = null;
    screen.classList.add("dragging");
    svg.setPointerCapture(e.pointerId);
    applyDial(min);
  });
  svg.addEventListener("pointermove", e => {
    if (dragging) applyDial(dialMinutes(e).min);
  });
  let lastDial = null;
  // 뽀모도로: 눈금 = 분 / 트래킹: 5칸 = 1시간 (0 = 12시간)
  function applyDial(min) {
    // 0 근처에서 60 ↔ 1로 튀지 않도록 보정
    if (lastDial !== null && lastDial >= 50 && min <= 10) min = 60;
    else if (lastDial !== null && lastDial <= 10 && min >= 50) min = 1;
    lastDial = min;
    if (S.mode === "pomo") setSetting("focusSec", min * 60);
    else setGoal(Math.max(1, Math.round(min / 5)) * 60);
  }
  const endDrag = () => { dragging = false; screen.classList.remove("dragging"); };
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);

  renderSound();
  render();
})();
</script>
</body>
</html>
