<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dayflow · 오늘의 흐름</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Montserrat:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#e6e6e8; --surface:#ffffff; --panel:#f3f3f4; --card:#ffffff; --chrome:#ffffff;
  --text:#141414; --muted:#8a8a8f; --border:#dcdcdf; --line:#1a1a1a; --rule:#f0f0f1;
  --blue:#3b57e0; --blue-soft:#e4e9fc; --ink:#161616; --ink-card:#242426;
  --row:34px;
  --sans:"Montserrat","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --script:"Kaushan Script","Brush Script MT",cursive;
  font-family:var(--sans);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0c0d; --surface:#161618; --panel:#1f1f22; --card:#1c1c1f; --chrome:#161618;
    --text:#f1f1f2; --muted:#96969c; --border:#303035; --line:#c8c8cc; --rule:#222226;
    --blue:#6d84ff; --blue-soft:#222a4f; --ink:#050506; --ink-card:#1d1d20;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0c0d; --surface:#161618; --panel:#1f1f22; --card:#1c1c1f; --chrome:#161618;
  --text:#f1f1f2; --muted:#96969c; --border:#303035; --line:#c8c8cc; --rule:#222226;
  --blue:#6d84ff; --blue-soft:#222a4f; --ink:#050506; --ink-card:#1d1d20;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding:20px max(20px,env(safe-area-inset-right)) 20px max(20px,env(safe-area-inset-left))}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}

/* ---------- window chrome ---------- */
.window{max-width:1440px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border-top:14px solid #cfcfd2;box-shadow:0 1px 0 rgba(0,0,0,.04),0 24px 60px rgba(0,0,0,.08);position:relative}
.window::before{content:"";position:absolute;top:-10px;left:10px;width:34px;height:6px;background:radial-gradient(circle,#b3b3b7 2.6px,transparent 3px) 0 0/12px 6px repeat-x}
.titlebar{display:flex;align-items:flex-end;gap:18px;background:var(--chrome);border-bottom:1px solid var(--border);padding:0 26px;flex-wrap:wrap}
.dots{display:none}
.address{align-self:center;display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 560px;margin:18px 0}
.address svg{width:15px;height:15px;fill:var(--blue);flex:none}
.address .url{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800;font-size:15px;letter-spacing:.32em;text-transform:uppercase;color:var(--text)}
.datenav{display:flex;align-items:center;font-size:12px;font-weight:600;letter-spacing:.12em;flex:none;border:1px solid var(--border)}
.datenav button{padding:7px 11px;white-space:nowrap}
.datenav button:hover{color:var(--blue)}
#dateLabel{border-left:1px solid var(--border);border-right:1px solid var(--border);min-width:120px}
.tabs{margin-left:auto;display:flex;align-items:flex-end;gap:34px}
.tab{position:relative;height:52px;font-size:11px;font-weight:700;letter-spacing:.24em;color:var(--muted);padding:0 2px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--blue)}
.tab.on::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);border:5px solid transparent;border-bottom-color:var(--blue)}

main{flex:1;min-height:0;position:relative}
.view{display:none;height:100%;padding:30px 32px 24px;min-height:0}
.view.on{display:grid}

/* ---------- task cards ---------- */
.side{display:flex;flex-direction:column;min-height:0}
.side-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 14px;margin-bottom:14px;border-bottom:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--blue)}
.side-head b{color:var(--text);font-size:13px;letter-spacing:.05em}
.drop-list{display:flex;flex-direction:column;gap:10px;min-height:60px;overflow-y:auto;overscroll-behavior:contain;padding:2px;transition:background .15s}
.side .drop-list{flex:1}
.drop-list.over{background:var(--blue-soft)}
.hint{color:inherit;opacity:.6;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;padding:6px 2px}
.drop-list:has(.ph) .hint{display:none}

.card{display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;min-height:58px;border:1px solid var(--border);background:var(--card);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;flex:none;transition:border-color .15s}
.card:hover{border-color:var(--text)}
.card .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding:8px 0}
.card .note{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .title{min-width:0;font-size:15px;font-weight:600;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.done .title{text-decoration:line-through;color:var(--muted);font-weight:500}
.card .grip{display:flex;color:var(--muted)}
.card .grip svg{width:13px;height:13px}
.card .num{font-size:12px;font-weight:800;color:var(--blue);min-width:14px;margin-left:-4px;letter-spacing:.04em}
.acts{display:flex;align-items:center}
.ic{width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}
.ic:hover{color:var(--blue)}
.ic svg{width:18px;height:18px}
.heart{width:28px;margin-left:-6px}
.heart svg{fill:none;stroke:var(--blue);stroke-width:2}
.heart.on svg{fill:var(--blue)}
.card.done [data-act=done]{color:var(--blue)}
.qdot{width:8px;height:8px;flex:none}
.qdot.do{background:var(--blue)} .qdot.schedule{background:transparent;box-shadow:inset 0 0 0 1.5px var(--blue)} .qdot.delegate{background:var(--text)} .qdot.pass{background:var(--muted)}
.card.compact{min-height:48px;padding-left:12px}
.card.compact .title{font-size:14px}
.card.compact .ic{width:32px;height:32px}
.ph{flex:none;border:1.5px dashed var(--blue);background:var(--blue-soft)}
.ghost{position:fixed;z-index:1000;pointer-events:none;margin:0;border-color:var(--blue)!important;box-shadow:8px 8px 0 var(--blue);transform:rotate(-1.5deg)}

.quick{display:flex;margin-top:16px;border:1px solid var(--text)}
.quick input{flex:1;min-width:0;height:50px;border:0;padding:0 16px;font-size:14px;background:var(--surface)}
.quick input::placeholder{color:var(--muted);letter-spacing:.04em}
.quick button{width:54px;height:50px;background:var(--text);display:grid;place-items:center;color:var(--surface);transition:background .15s}
.quick button:hover{background:var(--blue);color:#fff}
.quick button svg{width:20px;height:20px}

/* ---------- matrix ---------- */
#view-matrix{grid-template-columns:minmax(280px,31%) 1fr;gap:44px}
.quads{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;min-height:0}
.quad{display:flex;flex-direction:column;min-height:0;padding:22px 20px 18px;transition:outline-color .15s;outline:2px dashed transparent;outline-offset:-8px}
.quad.over{outline-color:currentColor}
.quad header{display:flex;align-items:center;gap:6px;margin-bottom:16px}
.quad h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;flex:1;display:flex;align-items:center;gap:8px;white-space:nowrap}
.quad h3 svg{width:19px;height:19px;flex:none}
.quad .drop-list{flex:1}
.q-do{background:var(--blue);color:#fff}
.q-schedule{background:var(--surface);color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.q-delegate{background:var(--ink);color:#fff}
.q-pass{background:var(--panel);color:var(--text)}
.quad .card{color:var(--text)}
.q-do .card{border-color:transparent}
.q-delegate .card{background:var(--ink-card);color:#f1f1f2;border-color:#333}
.q-delegate .card .ic{color:#9a9aa0}
.tag{font-size:9.5px;font-weight:700;letter-spacing:.14em;padding:5px 8px;border:1px solid currentColor;white-space:nowrap;opacity:.9}
.t-nimp,.t-nurg{opacity:.5}

/* ---------- flow ---------- */
#view-flow{grid-template-columns:1fr 1fr;gap:52px}
.slots{display:flex;flex-direction:column;gap:14px;min-height:0;overflow-y:auto;padding:2px}
.slot{background:var(--panel);border-left:4px solid var(--blue);padding:18px 18px 16px;display:flex;flex-direction:column;flex:1 0 190px;transition:outline-color .15s;outline:2px dashed transparent;outline-offset:-6px}
.slot:nth-child(3){background:var(--ink);color:#fff;border-left-color:var(--blue)}
.slot:nth-child(3) .card{background:var(--ink-card);color:#f1f1f2;border-color:#333}
.slot.over{outline-color:var(--blue)}
.slot header{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.slot h3{margin:0;font-size:20px;color:var(--blue);font-weight:800}
.slot .time{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.16em;flex:1}
.slot .cnt{font-weight:800;font-size:15px}
.slot .drop-list{flex:1;min-height:90px}

/* ---------- calendar ---------- */
#view-calendar{grid-template-rows:auto auto 1fr}
.cal-top{display:flex;align-items:center;gap:10px;margin-bottom:18px;min-height:64px}
.cal-top h2{margin:0;display:flex;align-items:center;gap:16px;font-weight:400}
.cal-top .script{font-family:var(--script);color:var(--blue);font-size:54px;line-height:1;transform:rotate(-5deg) translateY(-2px);letter-spacing:-.01em}
.cal-top .yr{font-size:12px;font-weight:700;letter-spacing:.28em;color:var(--text);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0}
.cal-top .grow{flex:1}
.pill-btn{height:38px;padding:0 18px;border:1px solid var(--text);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;background:var(--surface)}
.pill-btn:hover{border-color:var(--blue);color:var(--blue)}
.pill-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.pill-btn.primary:hover{color:#fff;filter:brightness(1.08)}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;letter-spacing:.24em;color:var(--muted);text-align:center;padding-bottom:10px}
.cal-dow div:first-child{color:var(--blue)}
.cal-weeks{overflow-y:auto;border-bottom:1px solid var(--line);min-height:0}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--border)}
.week:first-child{border-top:0}
.cell{grid-row:1/-1;position:relative;border-left:1px solid var(--border);cursor:pointer;background-image:repeating-linear-gradient(to bottom,transparent 0 calc(var(--row) - 1px),var(--rule) calc(var(--row) - 1px) var(--row))}
.cell:first-child{border-left:0}
.cell:hover{background-color:var(--blue-soft)}
.cell.sel{background-color:var(--blue-soft)}
.num{position:absolute;top:8px;right:8px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--text);font-variant-numeric:tabular-nums;line-height:20px;padding:0 5px}
.cell.out .num{color:var(--muted);opacity:.45}
.cell.today .num{background:var(--blue);color:#fff}
.ev{position:relative;z-index:1;align-self:center;height:calc(var(--row) - 8px);margin:0 4px;padding:0 9px;display:flex;align-items:center;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ev{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.evchk{position:relative;flex:none;width:14px;height:14px;margin-right:7px;border:1.5px solid currentColor;display:grid;place-items:center;opacity:.85}
.evchk::before{content:"";position:absolute;inset:-8px}
.evchk svg{width:12px;height:12px;stroke-width:3}
.evchk:hover{opacity:1}
.evq{flex:none;width:7px;height:7px;margin-right:6px;box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.evq.do{background:var(--blue)} .evq.schedule{background:#fff;box-shadow:inset 0 0 0 1.5px var(--blue),0 0 0 1.5px rgba(255,255,255,.9)} .evq.delegate{background:#161616} .evq.pass{background:#9a9aa0}
.evghost{position:fixed;z-index:1000;pointer-events:none;margin:0!important;box-shadow:6px 6px 0 var(--blue);transform:rotate(-1.5deg)}
.cell.drop{background-color:var(--blue-soft);box-shadow:inset 0 0 0 2px var(--blue)}
.ev span{overflow:hidden;text-overflow:ellipsis}
.ev.l{margin-left:0} .ev.r{margin-right:0}
.ev.done span{text-decoration:line-through;opacity:.55}
.ev:hover{filter:brightness(.95)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:2000;background:rgba(10,10,12,.45);display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.sheet{width:min(460px,100%);background:var(--surface);border-top:4px solid var(--blue);padding:26px;box-shadow:12px 12px 0 rgba(59,87,224,.25);display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0 0 4px;font-weight:800;font-size:19px;color:var(--blue)}
.sheet label{display:flex;flex-direction:column;gap:6px;font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.16em;flex:1;min-width:0}
.sheet input,.sheet select{height:44px;border:1px solid var(--border);border-radius:0;padding:0 12px;font-size:15px;letter-spacing:0;font-weight:500;color:var(--text);background:var(--surface);width:100%}
.sheet input:focus,.sheet select:focus{border-color:var(--blue)}
.sheet .row{display:flex;gap:12px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:32px;height:32px;border:1px solid rgba(128,128,128,.3)}
.sw.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--blue)}
.btns{display:flex;gap:8px;align-items:center;margin-top:6px}
.btns .grow{flex:1}
.danger{color:#d23a3a;font-size:11px;font-weight:700;letter-spacing:.16em;padding:8px 2px}

.saved{position:fixed;right:34px;bottom:28px;z-index:50;font-family:var(--script);font-size:30px;color:var(--blue);transform:rotate(-6deg);opacity:0;transition:opacity .3s}
.saved.show{opacity:1}
.saved svg{display:none}

/* ---------- responsive ---------- */
@media (max-width:900px){
  body{padding:10px}
  .titlebar{padding:0 14px}
  .address{flex:1 1 100%;margin:14px 0 4px}
  .address .url{font-size:12px;letter-spacing:.2em}
  .tabs{margin-left:0;width:100%;justify-content:space-around;gap:0}
  .tab{height:42px;font-size:10px}
  .view{padding:18px 14px 14px;overflow-y:auto}
  #view-matrix,#view-flow{grid-template-columns:1fr;gap:22px;align-content:start}
  .side .drop-list{max-height:38vh}
  .quads{grid-template-columns:1fr;grid-template-rows:none}
  .quad{min-height:180px}
  .slots{overflow:visible}
  :root{--row:28px}
  .ev{font-size:10.5px;padding:0 5px;margin:0 2px}
  .evchk{width:11px;height:11px;margin-right:4px}
  .evchk svg{width:9px;height:9px}
  .evq{width:5px;height:5px;margin-right:4px}
  .num{font-size:10px;top:5px;right:3px;padding:0 3px}
  .cal-top .script{font-size:38px}
  .cal-dow{font-size:9px;letter-spacing:.1em}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="address">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.4-4.5-9.5-9.1C1 8.6 3 5 6.6 5c2.1 0 3.7 1.2 5.4 3.2C13.7 6.2 15.3 5 17.4 5 21 5 23 8.6 21.5 11.9 19.4 16.5 12 21 12 21z"/></svg>
      <span class="url">dayflow</span>
      <div class="datenav">
        <button id="prev" aria-label="이전">&lt;</button>
        <button id="dateLabel" title="오늘로 이동"></button>
        <button id="next" aria-label="다음">&gt;</button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" data-view="calendar" role="tab">CALENDAR</button>
      <button class="tab" data-view="matrix" role="tab">MATRIX</button>
      <button class="tab" data-view="flow" role="tab">FLOW</button>
    </nav>
  </div>

  <main>
    <!-- CALENDAR -->
    <section class="view" id="view-calendar">
      <div class="cal-top">
        <h2 id="calTitle"></h2>
        <div class="grow"></div>
        <button class="pill-btn" id="calToday">오늘</button>
        <button class="pill-btn primary" id="calAdd">+ 새 할 일</button>
      </div>
      <div class="cal-dow"><div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div></div>
      <div class="cal-weeks" id="calWeeks"></div>
    </section>

    <!-- MATRIX -->
    <section class="view" id="view-matrix">
      <aside class="side">
        <div class="side-head"><span id="mHead">오늘 할 일</span><b id="mCount">0</b></div>
        <div class="drop-list" data-drop="q:inbox" id="mList"></div>
        <form class="quick" data-quick>
          <input placeholder="빠른 추가" aria-label="빠른 추가" enterkeyhint="done">
          <button type="submit" aria-label="추가"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        </form>
      </aside>
      <div class="quads" id="quads"></div>
    </section>

    <!-- FLOW -->
    <section class="view" id="view-flow">
      <aside class="side">
        <div class="side-head"><span>ORDER</span><b id="fCount">0</b></div>
        <div class="drop-list" data-drop="s:inbox" id="fList"></div>
        <form class="quick" data-quick>
          <input placeholder="빠른 추가" aria-label="빠른 추가" enterkeyhint="done">
          <button type="submit" aria-label="추가"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        </form>
      </aside>
      <div class="slots" id="slots"></div>
    </section>
  </main>
</div>

<div class="saved" id="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Saved!</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mdTitle">
    <h3 id="mdTitle">새 할 일</h3>
    <label>제목<input id="fTitle" autocomplete="off" enterkeyhint="done"></label>
    <div class="row">
      <label>시작일<input type="date" id="fStart"></label>
      <label>종료일<input type="date" id="fEnd"></label>
    </div>
    <label>메모 (완료 기준)<input id="fNote" autocomplete="off" enterkeyhint="done"></label>
    <label>색상<div class="swatches" id="fColors"></div></label>
    <div class="row">
      <label>사분면
        <select id="fQuad">
          <option value="">미분류</option>
          <option value="do">일단 이것부터</option>
          <option value="schedule">시간 빼두기</option>
          <option value="delegate">얼른 처리하기</option>
          <option value="pass">패스</option>
        </select>
      </label>
      <label>시간대
        <select id="fSlot">
          <option value="">미분류</option>
          <option value="morning">오전</option>
          <option value="afternoon">오후</option>
          <option value="night">밤</option>
        </select>
      </label>
    </div>
    <div class="btns">
      <button class="danger" id="fDel">삭제</button>
      <div class="grow"></div>
      <button class="pill-btn" id="fCancel">취소</button>
      <button class="pill-btn primary" id="fSave">저장</button>
    </div>
  </div>
</div>

<script>
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const todayStr = () => ymd(new Date());
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DOW = '일월화수목금토';

const I = {
  heart: '<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.3-9-8.6C1.6 8.3 3.5 5 6.8 5c2 0 3.5 1.1 5.2 3 1.7-1.9 3.2-3 5.2-3 3.3 0 5.2 3.3 3.8 6.4-2 4.3-9 8.6-9 8.6z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="4" y="5.5" width="16" height="14.5" rx="2"/><path d="M8 3.5v4M16 3.5v4M4 10h16M8 13.5h.01M12 13.5h.01M16 13.5h.01M8 16.5h.01M12 16.5h.01M16 16.5h.01"/></svg>',
  up: '<svg viewBox="0 0 24 24"><path d="M12 5.5l7.5 12.5h-15z" fill="currentColor"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>',
  grip: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg>',
  calq: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="5.5" width="16" height="14.5" rx="2"/><path d="M8 3.5v4M16 3.5v4M4 10h16M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg>'
};

const COLORS = { gray: ['#ececed', '#1a1a1a'], pink: ['#3b57e0', '#ffffff'], yellow: ['#e4e9fc', '#1f2f8a'], blue: ['#b9c5f6', '#12205e'], green: ['#1b1b1b', '#ffffff'], purple: ['#9a9aa0', '#ffffff'] };
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const QUADS = [
  { key: 'do', title: '일단 이것부터', icon: I.alert, tags: [['중요', 't-imp'], ['긴급', 't-urg']] },
  { key: 'schedule', title: '시간 빼두기', icon: I.calq, tags: [['중요', 't-imp'], ['긴급X', 't-nurg']] },
  { key: 'delegate', title: '얼른 처리하기', icon: I.clock, tags: [['중요X', 't-nimp'], ['긴급', 't-urg']] },
  { key: 'pass', title: '패스', icon: I.arrow, tags: [['중요X', 't-nimp'], ['긴급X', 't-nurg']] }
];
const SLOTS = [
  { key: 'morning', title: '오전', time: '08:00~12:00' },
  { key: 'afternoon', title: '오후', time: '12:00~18:00' },
  { key: 'night', title: '밤', time: '18:00~' }
];
const QRANK = { do: 0, schedule: 1, delegate: 2, pass: 3 };

/* ---------- storage ---------- */
const KEY = 'dayflow-v1';
let memCopy = null;
function load() {
  try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {}
  return memCopy;
}
let savedTimer;
function save() {
  const { view, tasks, imported } = state;
  memCopy = JSON.parse(JSON.stringify({ view, tasks, imported }));
  try { localStorage.setItem(KEY, JSON.stringify({ view, tasks, imported })); } catch (e) {}
  const el = $('#saved'); el.classList.add('show');
  clearTimeout(savedTimer); savedTimer = setTimeout(() => el.classList.remove('show'), 1200);
}
function makeTask(title, date, extra = {}) {
  return { id: uid(), title, date, end: null, done: false, fav: false, quad: null, slot: null, order: 0, forder: null, color: 'gray', note: '', calOnly: false, ...extra };
}
function seed() {
  const t = todayStr();
  return {
    view: 'matrix',
    tasks: [
      makeTask('연휴 학습 계획 세우기', t, { fav: true, order: 1 }),
      makeTask('[신경물치] PBL 자료 수집', t, { fav: true, order: 2 }),
      makeTask('이전까지 수업들 GPT에 올리기', t, { fav: true, order: 3 }),
      makeTask('연휴 강의들 정리', t, { fav: true, order: 4 }),
      makeTask('드림닥터 팝업', addDays(t, -8), { end: addDays(t, -4), order: 5 }),
      makeTask('순천향 외래', addDays(t, 3), { color: 'pink', order: 6 }),
      makeTask('봉화산 짐 옮기기', addDays(t, 9), { color: 'pink', order: 7 })
    ]
  };
}

let state = load() || seed();
state.date = todayStr();
state.month = state.date.slice(0, 7);
if (!['calendar', 'matrix', 'flow'].includes(state.view)) state.view = 'matrix';

const find = id => state.tasks.find(t => t.id === id);
const endOf = t => t.end || t.date;
const tasksOn = d => state.tasks.filter(t => t.date <= d && endOf(t) >= d);
const byOrder = (a, b) => (a.order || 0) - (b.order || 0);
const flowKey = t => t.forder != null ? t.forder : 1e9 + (t.quad ? QRANK[t.quad] : 4) * 1e6 + (t.order || 0);
const byFlow = (a, b) => flowKey(a) - flowKey(b);
const maxOrder = () => Math.max(0, ...state.tasks.map(t => t.order || 0));
function commit() { save(); render(); }

/* ---------- card ---------- */
function card(t, o = {}) {
  const el = document.createElement('div');
  el.className = 'card' + (o.compact ? ' compact' : '') + (t.done ? ' done' : '');
  el.dataset.id = t.id;
  let h = '';
  if (!o.compact) h += `<button class="ic heart ${t.fav ? 'on' : ''}" data-act="fav" aria-label="즐겨찾기">${I.heart}</button>`;
  if (o.num != null) h += `<span class="grip">${I.grip}</span><span class="num">${o.num}</span>`;
  if (o.showQuad && t.quad) h += `<i class="qdot ${t.quad}"></i>`;
  h += `<div class="tt"><span class="title">${esc(t.title)}</span>${!o.compact && t.note ? `<span class="note">${esc(t.note)}</span>` : ''}</div><div class="acts">`;
  h += `<button class="ic" data-act="done" aria-label="완료">${I.check}</button>`;
  if (o.compact) {
    h += `<button class="ic" data-act="edit" aria-label="편집">${I.cal}</button>`;
    h += `<button class="ic" data-act="unassign" data-field="${o.unassign}" aria-label="목록으로 되돌리기">${I.back}</button>`;
  } else {
    h += `<button class="ic" data-act="edit" aria-label="날짜·편집">${I.cal}</button>`;
    h += `<button class="ic" data-act="up" aria-label="위로">${I.up}</button>`;
    h += `<button class="ic" data-act="del" aria-label="삭제">${I.x}</button>`;
  }
  el.innerHTML = h + '</div>';
  return el;
}
function hint(text) { const d = document.createElement('div'); d.className = 'hint'; d.textContent = text; return d; }

/* ---------- render ---------- */
function render() {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.view === state.view));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'view-' + state.view));
  if (state.view === 'calendar') {
    const [y, m] = state.month.split('-');
    $('#dateLabel').textContent = `${y}년 ${+m}월`;
    renderCalendar();
  } else {
    const d = parse(state.date);
    $('#dateLabel').textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`;
    state.view === 'matrix' ? renderMatrix() : renderFlow();
  }
}

function renderMatrix() {
  const d = parse(state.date);
  $('#mHead').textContent = state.date === todayStr() ? '오늘 할 일' : `${d.getMonth() + 1}월 ${d.getDate()}일 할 일`;
  const list = tasksOn(state.date);
  const inbox = list.filter(t => !t.quad).sort(byOrder);
  $('#mCount').textContent = inbox.length;
  const ml = $('#mList');
  ml.replaceChildren(...inbox.map(t => card(t)));
  if (!inbox.length) ml.append(hint(list.length ? '모두 분류했어요' : '아래에 할 일을 추가하세요'));

  const q = $('#quads');
  if (!q.children.length) {
    q.innerHTML = QUADS.map(x => `
      <div class="quad q-${x.key}" data-drop="q:${x.key}">
        <header><h3>${x.icon}${x.title}</h3>${x.tags.map(([l, c]) => `<span class="tag ${c}">${l}</span>`).join('')}</header>
        <div class="drop-list"></div>
      </div>`).join('');
  }
  QUADS.forEach(x => {
    const body = q.querySelector(`[data-drop="q:${x.key}"] .drop-list`);
    const items = list.filter(t => t.quad === x.key).sort(byOrder);
    body.replaceChildren(...items.map(t => card(t, { compact: true, unassign: 'quad' })));
    if (!items.length) body.append(hint('여기로 드롭'));
  });
}

function renderFlow() {
  const list = tasksOn(state.date);
  const inbox = list.filter(t => !t.slot).sort(byFlow);
  $('#fCount').textContent = inbox.length;
  const fl = $('#fList');
  fl.replaceChildren(...inbox.map((t, i) => card(t, { num: i + 1, showQuad: true })));
  if (!inbox.length) fl.append(hint(list.length ? '모두 배치했어요' : '아래에 할 일을 추가하세요'));

  const s = $('#slots');
  if (!s.children.length) {
    s.innerHTML = SLOTS.map(x => `
      <div class="slot" data-drop="s:${x.key}">
        <header><h3>${x.title}</h3><span class="time">${x.time}</span><span class="cnt">0</span></header>
        <div class="drop-list"></div>
      </div>`).join('');
  }
  SLOTS.forEach(x => {
    const box = s.querySelector(`[data-drop="s:${x.key}"]`);
    const items = list.filter(t => t.slot === x.key).sort(byFlow);
    box.querySelector('.cnt').textContent = items.length;
    box.querySelector('.drop-list').replaceChildren(...items.map(t => card(t, { compact: true, unassign: 'slot', showQuad: true })));
  });
}

function renderCalendar() {
  const [y, m] = state.month.split('-').map(Number);
  $('#calTitle').innerHTML = `<span class="script">${MONTHS[m - 1]}</span><span class="yr">${y} / ${pad(m)}</span>`;
  const first = new Date(y, m - 1, 1), last = new Date(y, m, 0);
  let ws = ymd(new Date(y, m - 1, 1 - first.getDay()));
  const endS = ymd(new Date(y, m - 1, last.getDate() + (6 - last.getDay())));
  const today = todayStr();
  const wrap = $('#calWeeks');
  wrap.innerHTML = '';
  while (ws <= endS) {
    const we = addDays(ws, 6);
    const evs = state.tasks
      .filter(t => t.date <= we && endOf(t) >= ws)
      .sort((a, b) => a.date.localeCompare(b.date) || diffDays(b.date, endOf(b)) - diffDays(a.date, endOf(a)) || byOrder(a, b));
    const lanes = [];
    const placed = evs.map(t => {
      const s = t.date < ws ? ws : t.date, e = endOf(t) > we ? we : endOf(t);
      const cs = diffDays(ws, s), ce = diffDays(ws, e);
      let lane = lanes.findIndex(end => end < cs);
      if (lane < 0) { lane = lanes.length; lanes.push(ce); } else lanes[lane] = ce;
      return { t, cs, ce, lane, l: t.date < ws, r: endOf(t) > we };
    });
    const week = document.createElement('div');
    week.className = 'week';
    const filler = Math.max(1, 3 - lanes.length);
    week.style.gridTemplateRows = `repeat(${1 + lanes.length + filler}, var(--row))`;
    let h = '';
    for (let i = 0; i < 7; i++) {
      const d = addDays(ws, i);
      const cls = ['cell'];
      if (d.slice(0, 7) !== state.month) cls.push('out');
      if (d === today) cls.push('today');
      if (d === state.date && d !== today) cls.push('sel');
      h += `<div class="${cls.join(' ')}" data-date="${d}" style="grid-column:${i + 1}"><span class="num">${pad(+d.slice(8))}</span></div>`;
    }
    placed.forEach(p => {
      const cls = ['ev']; if (p.l) cls.push('l'); if (p.r) cls.push('r'); if (p.t.done) cls.push('done');
      const [bg, fg] = COLORS[p.t.color] || COLORS.gray;
      const tip = [p.t.note, p.t.quad && QUADS.find(q => q.key === p.t.quad).title, p.t.slot && SLOTS.find(x => x.key === p.t.slot).title].filter(Boolean).join(' / ');
      h += `<div class="${cls.join(' ')}" data-ev="${p.t.id}" title="${esc(tip)}" style="grid-row:${p.lane + 2};grid-column:${p.cs + 1}/${p.ce + 2};background:${bg};color:${fg}">`
        + (p.l ? '' : `<button class="evchk" data-evdone="${p.t.id}" aria-label="${p.t.done ? '완료 취소' : '완료'}">${p.t.done ? I.check : ''}</button>`)
        + (p.t.quad ? `<i class="evq ${p.t.quad}"></i>` : '')
        + `<span>${esc(p.t.title)}</span></div>`;
    });
    week.innerHTML = h;
    wrap.append(week);
    ws = addDays(ws, 7);
  }
}

/* ---------- navigation ---------- */
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  state.view = b.dataset.view;
  if (state.view === 'calendar') state.month = state.date.slice(0, 7);
  save(); render();
}));
function shift(n) {
  if (state.view === 'calendar') {
    const [y, m] = state.month.split('-').map(Number);
    state.month = ymd(new Date(y, m - 1 + n, 1)).slice(0, 7);
  } else {
    state.date = addDays(state.date, n);
  }
  render();
}
$('#prev').onclick = () => shift(-1);
$('#next').onclick = () => shift(1);
$('#dateLabel').onclick = () => { state.date = todayStr(); state.month = state.date.slice(0, 7); render(); };
$('#calToday').onclick = $('#dateLabel').onclick;
$('#calAdd').onclick = () => openModal({ date: state.date });

$('#calWeeks').addEventListener('click', e => {
  const chk = e.target.closest('[data-evdone]');
  if (chk) { const t = find(chk.dataset.evdone); if (t) { t.done = !t.done; commit(); } return; }
  const ev = e.target.closest('[data-ev]');
  if (ev) { const t = find(ev.dataset.ev); if (t) openModal({ task: t }); return; }
  const cell = e.target.closest('.cell');
  if (cell) { state.date = cell.dataset.date; renderCalendar(); openModal({ date: cell.dataset.date }); }
});

document.querySelectorAll('[data-quick]').forEach(f => f.addEventListener('submit', e => {
  e.preventDefault();
  const inp = f.querySelector('input'); const v = inp.value.trim();
  if (!v) return;
  state.tasks.push(makeTask(v, state.date, { order: maxOrder() + 1 }));
  inp.value = ''; commit();
}));

/* ---------- card actions ---------- */
let justDragged = false;
document.addEventListener('click', e => {
  if (justDragged) { e.stopPropagation(); e.preventDefault(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const cardEl = b.closest('.card'); const t = cardEl && find(cardEl.dataset.id); if (!t) return;
  switch (b.dataset.act) {
    case 'fav': t.fav = !t.fav; commit(); break;
    case 'done': t.done = !t.done; commit(); break;
    case 'edit': openModal({ task: t }); break;
    case 'unassign': t[b.dataset.field] = null; commit(); break;
    case 'del': state.tasks = state.tasks.filter(x => x !== t); commit(); break;
    case 'up': {
      const ids = [...cardEl.parentElement.querySelectorAll(':scope > .card')].map(c => c.dataset.id);
      const i = ids.indexOf(t.id);
      if (i > 0) { [ids[i - 1], ids[i]] = [ids[i], ids[i - 1]]; applyOrder(ids); }
      break;
    }
  }
}, true);

function applyOrder(ids) {
  const f = state.view === 'flow' ? 'forder' : 'order';
  ids.forEach((id, i) => { const x = find(id); if (x) x[f] = i + 1; });
  commit();
}

/* ---------- drag & drop (mouse + touch) ---------- */
let drag = null;
document.addEventListener('pointerdown', e => {
  const c = e.target.closest('.card');
  if (!c || e.target.closest('button') || c.classList.contains('ghost')) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  drag = { el: c, id: c.dataset.id, sx: e.clientX, sy: e.clientY, pid: e.pointerId, started: false, target: null };
});
window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  if (!drag.started) {
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 6) return;
    startDrag();
  }
  e.preventDefault();
  moveDrag(e.clientX, e.clientY);
}, { passive: false });
window.addEventListener('pointerup', e => { if (drag && e.pointerId === drag.pid) endDrag(true); });
window.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.pid) endDrag(false); });

function startDrag() {
  const r = drag.el.getBoundingClientRect();
  drag.ox = drag.sx - r.left; drag.oy = drag.sy - r.top;
  const g = drag.el.cloneNode(true);
  g.classList.add('ghost');
  g.style.width = r.width + 'px'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px';
  document.body.append(g);
  drag.ghost = g;
  drag.ph = document.createElement('div');
  drag.ph.className = 'ph'; drag.ph.style.height = r.height + 'px';
  drag.el.after(drag.ph);
  drag.el.style.display = 'none';
  drag.started = true;
  document.body.classList.add('dragging');
}
function moveDrag(x, y) {
  drag.ghost.style.left = (x - drag.ox) + 'px';
  drag.ghost.style.top = (y - drag.oy) + 'px';
  const under = document.elementFromPoint(x, y);
  const target = under && under.closest('[data-drop]');
  if (drag.target && drag.target !== target) drag.target.classList.remove('over');
  drag.target = target;
  if (!target) return;
  target.classList.add('over');
  const list = target.classList.contains('drop-list') ? target : target.querySelector('.drop-list');
  const cards = [...list.querySelectorAll(':scope > .card')].filter(c => c !== drag.el);
  const before = cards.find(c => { const r = c.getBoundingClientRect(); return y < r.top + r.height / 2; });
  if (before) { if (drag.ph.nextSibling !== before) list.insertBefore(drag.ph, before); }
  else { const hintEl = list.querySelector(':scope > .hint'); if (drag.ph.parentElement !== list || drag.ph.nextSibling) list.insertBefore(drag.ph, hintEl && !cards.length ? hintEl : null); }
}
function endDrag(drop) {
  const d = drag; drag = null;
  if (!d.started) return;
  document.body.classList.remove('dragging');
  d.ghost.remove();
  if (d.target) d.target.classList.remove('over');
  justDragged = true; setTimeout(() => justDragged = false, 60);
  if (drop && d.target && d.ph.parentElement) {
    const list = d.ph.parentElement;
    const ids = [...list.children].filter(c => c === d.ph || (c.classList.contains('card') && c !== d.el)).map(c => c === d.ph ? d.id : c.dataset.id);
    const t = find(d.id);
    const [kind, val] = d.target.dataset.drop.split(':');
    const v = val === 'inbox' ? null : val;
    if (kind === 'q') t.quad = v; else t.slot = v;
    d.ph.remove();
    applyOrder(ids);
  } else {
    d.ph.remove(); d.el.style.display = '';
  }
}

/* ---------- modal ---------- */
let editing = null, selColor = 'gray';
function renderSwatches() {
  $('#fColors').innerHTML = Object.entries(COLORS).map(([k, c]) =>
    `<button type="button" class="sw ${k === selColor ? 'on' : ''}" data-color="${k}" style="background:${c[0]}" aria-label="${k}"></button>`).join('');
}
$('#fColors').addEventListener('click', e => { const b = e.target.closest('[data-color]'); if (b) { selColor = b.dataset.color; renderSwatches(); } });
function openModal({ task, date }) {
  editing = task || null;
  $('#mdTitle').textContent = task ? '할 일 편집' : '새 할 일';
  $('#fTitle').value = task ? task.title : '';
  $('#fNote').value = task ? (task.note || '') : '';
  $('#fStart').value = task ? task.date : date;
  $('#fEnd').value = task ? endOf(task) : date;
  $('#fQuad').value = task?.quad || '';
  $('#fSlot').value = task?.slot || '';
  selColor = task ? task.color : 'gray';
  $('#fDel').hidden = !task;
  renderSwatches();
  $('#modal').hidden = false;
  setTimeout(() => $('#fTitle').focus(), 30);
}
function closeModal() { $('#modal').hidden = true; editing = null; }
function saveModal() {
  const title = $('#fTitle').value.trim();
  if (!title) { $('#fTitle').focus(); return; }
  const start = $('#fStart').value || state.date;
  let end = $('#fEnd').value || start;
  if (end < start) end = start;
  const data = { note: $('#fNote').value.trim(), title, date: start, end: end === start ? null : end, color: selColor, quad: $('#fQuad').value || null, slot: $('#fSlot').value || null };

function importPlan() {
  state.imported = state.imported || [];
  if (state.imported.includes(PLAN_ID)) return false;
  const keep = new Set(PLAN.map(p => p.id));
  // 이전 계획본으로 들어온 항목 제거
  state.tasks = state.tasks.filter(t => !(/^p3?-/.test(t.id) && !keep.has(t.id)));
  const map = new Map(state.tasks.map(t => [t.id, t]));
  let o = maxOrder();
  PLAN.forEach(p => {
    const t = map.get(p.id);
    if (t) Object.assign(t, { title: p.title, note: p.note, color: p.color, date: p.date, end: p.end || null, calOnly: false });
    else state.tasks.push(makeTask(p.title, p.date, { ...p, order: ++o }));
  });
  state.imported.push(PLAN_ID);
  return true;
}

/* ---------- calendar: drag a pill to another date ---------- */
let evDrag = null;
function cellAt(x, y) {
  const under = document.elementFromPoint(x, y);
  const week = under && under.closest('.week');
  if (!week) return null;
  return [...week.querySelectorAll('.cell')].find(c => { const r = c.getBoundingClientRect(); return x >= r.left && x < r.right; }) || null;
}
$('#calWeeks').addEventListener('pointerdown', e => {
  const ev = e.target.closest('.ev');
  if (!ev || e.target.closest('button')) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const from = [...ev.parentElement.querySelectorAll('.cell')].find(c => { const r = c.getBoundingClientRect(); return e.clientX >= r.left && e.clientX < r.right; });
  evDrag = { el: ev, id: ev.dataset.ev, sx: e.clientX, sy: e.clientY, pid: e.pointerId, from: from && from.dataset.date, started: false, over: null };
});
window.addEventListener('pointermove', e => {
  if (!evDrag || e.pointerId !== evDrag.pid) return;
  if (!evDrag.started) {
    if (Math.hypot(e.clientX - evDrag.sx, e.clientY - evDrag.sy) < 6) return;
    const r = evDrag.el.getBoundingClientRect();
    const w = Math.min(r.width, 240);
    const g = evDrag.el.cloneNode(true);
    g.classList.add('evghost');
    Object.assign(g.style, { left: r.left + 'px', top: r.top + 'px', width: w + 'px', height: r.height + 'px' });
    document.body.append(g);
    evDrag.g = g;
    evDrag.ox = Math.min(evDrag.sx - r.left, w - 16);
    evDrag.oy = evDrag.sy - r.top;
    evDrag.el.style.opacity = '.3';
    evDrag.started = true;
    document.body.classList.add('dragging');
  }
  e.preventDefault();
  evDrag.g.style.left = (e.clientX - evDrag.ox) + 'px';
  evDrag.g.style.top = (e.clientY - evDrag.oy) + 'px';
  const cell = cellAt(e.clientX, e.clientY);
  if (evDrag.over && evDrag.over !== cell) evDrag.over.classList.remove('drop');
  evDrag.over = cell;
  if (cell) cell.classList.add('drop');
}, { passive: false });
function endEvDrag(ok) {
  const d = evDrag; evDrag = null;
  if (!d.started) return;
  d.g.remove(); d.el.style.opacity = '';
  document.body.classList.remove('dragging');
  if (d.over) d.over.classList.remove('drop');
  justDragged = true; setTimeout(() => justDragged = false, 60);
  if (ok && d.over && d.from) {
    const shift = diffDays(d.from, d.over.dataset.date);
    const t = find(d.id);
    if (t && shift) {
      t.date = addDays(t.date, shift);
      if (t.end) t.end = addDays(t.end, shift);
      commit();
    }
  }
}
window.addEventListener('pointerup', e => { if (evDrag && e.pointerId === evDrag.pid) endEvDrag(true); });
window.addEventListener('pointercancel', e => { if (evDrag && e.pointerId === evDrag.pid) endEvDrag(false); });

render();
