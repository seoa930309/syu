name: 안드로이드 앱(APK) 만들기

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'fonts/**'
      - 'icons/**'
      - 'manifest.webmanifest'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: android-actions/setup-android@v3

      - name: 안드로이드 프로젝트 준비
        run: bash android/setup.sh ${{ github.run_number }}

      - name: APK 만들기
        working-directory: app-build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dayflow.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: dayflow-apk
          path: dayflow.apk

      - name: 다운로드 페이지(릴리스)에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: dayflow 안드로이드 앱 1.${{ github.run_number }}
          body: |
            갤럭시 등 안드로이드 폰에서 **dayflow.apk**를 눌러 내려받아 설치하세요.
            처음이라면 "출처를 알 수 없는 앱 설치"를 허용해야 해요. 새 버전은 덮어 설치하면 되고, 데이터는 그대로 남아요.
          files: dayflow.apk
          make_latest: true
